const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='cnc-v13-key',SK=KEY+'.v2';
async function open(raw){
  if(raw.length!==64||D.v!==2||!D.mac)throw 'pw';
  const m=await crypto.subtle.importKey('raw',raw.slice(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  if(!await crypto.subtle.verify('HMAC',m,b(D.chk),new TextEncoder().encode(D.chkmsg)))throw 'pw';
  const iv=b(D.iv),ct=b(D.ct),ivct=new Uint8Array(iv.length+ct.length);ivct.set(iv);ivct.set(ct,iv.length);
  if(!await crypto.subtle.verify('HMAC',m,b(D.mac),ivct))throw 'bad';
  const k=await crypto.subtle.importKey('raw',raw.slice(0,32),'AES-CBC',false,['decrypt']);
  let t;try{t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:iv},k,ct))}catch(x){throw 'bad'}
  if(!t.startsWith(D.mark))throw 'bad';
  const h=t.slice(D.mark.length),mt=h.match(/<title>([^<]*)<\/title>/);
  document.open();document.write(h);document.close();if(mt)document.title=mt[1];
}
function bad(){const F=document.getElementById('f');F.querySelectorAll('input,button').forEach(x=>x.remove());document.getElementById('e').textContent='Сторінку пошкоджено або змінено — її не відкрито. Скажіть тому, хто надіслав посилання.';F.style.visibility=''}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(D.salt),iterations:D.iter},base,512));
}
(async()=>{
  let s=null;try{s=sessionStorage.getItem(SK)||localStorage.getItem(SK)}catch(e){}
  if(s){const F=document.getElementById('f');F.style.visibility='hidden';if(document.readyState!=='complete')await new Promise(r=>addEventListener('load',r));try{try{sessionStorage.setItem(SK,s)}catch(x){}await open(b(s));return}catch(e){if(e==='bad'){bad();return}F.style.visibility=''}}
  document.getElementById('f').addEventListener('submit',async ev=>{
    ev.preventDefault();const e=document.getElementById('e');e.textContent='Перевіряю…';
    try{const raw=await derive(document.getElementById('p').value);await open(raw);
      const k=btoa(String.fromCharCode(...raw));try{sessionStorage.setItem(SK,k);localStorage.setItem(SK,k)}catch(x){}}
    catch(x){if(x==='bad')bad();else e.textContent='Невірний пароль'}
  });
})();
